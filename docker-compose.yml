name: discord-bot

services:
  bot:
    build: .
    image: discord-bot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
    mem_limit: 512m  # ~180 MB covers 5 clans of ~30 linked players; the rest is headroom
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bot_net:
    driver: bridge
